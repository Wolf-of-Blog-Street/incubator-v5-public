<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fleet Chat</title>
<style>
:root { --bg:#0e1116; --panel:#161b22; --line:#262d36; --fg:#e6edf3; --muted:#8b949e; --accent:#58a6ff; --me:#3fb950; }
* { box-sizing:border-box } body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.5 -apple-system, system-ui, sans-serif; }
.wrap { display:grid; grid-template-columns: 1fr 320px; height:100vh; }
@media (max-width: 800px) { .wrap { grid-template-columns: 1fr; } aside { display:none } }
main { display:flex; flex-direction:column; min-width:0; }
#log { flex:1; overflow-y:auto; padding:16px; }
.m { padding:6px 0; border-bottom:1px solid var(--line); overflow-wrap:anywhere; }
.h { color:var(--muted); font-size:12px } .from { color:var(--accent); font-weight:600 } .to { color:var(--me) }
form { display:flex; gap:8px; padding:12px 16px; border-top:1px solid var(--line); background:var(--panel); }
input { background:var(--bg); color:var(--fg); border:1px solid var(--line); border-radius:6px; padding:8px; font:inherit; }
#to { width:200px } #text { flex:1; min-width:0 } button { background:var(--accent); color:#000; border:0; border-radius:6px; padding:8px 14px; font-weight:600 }
aside { border-left:1px solid var(--line); background:var(--panel); padding:16px; overflow-y:auto; font-size:13px; }
aside h2 { font-size:12px; text-transform:uppercase; color:var(--muted); margin:12px 0 6px } .s { margin:4px 0 } .c { color:var(--muted) }
</style></head>
<body><div class="wrap">
<main><div id="log"></div>
<form id="f"><input id="to" placeholder="@agent-f/wolf-den or #fleet" required><input id="text" placeholder="Message as the operator" required><button>Send</button></form></main>
<aside><h2>Online</h2><div id="online"></div><h2>Seats and contexts</h2><div id="dir"></div></aside>
</div>
<script>
const log = document.getElementById('log');
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; };
function add(m) {
  const d = el('div', 'm');
  const h = el('div', 'h'); h.append(el('span', 'from', '@' + m.from), ' → ', el('span', 'to', m.to), '  ' + new Date(m.ts).toLocaleTimeString() + '  #' + m.id);
  d.append(h, el('div', '', m.text)); log.append(d); log.scrollTop = log.scrollHeight;
}
async function who() {
  const w = await (await fetch('/who')).json();
  const on = document.getElementById('online'); on.replaceChildren();
  for (const s of w.sessions) on.append(el('div', 's', `@${s.seat}/${s.handle} · ${s.type} ${s.model} · ${s.context || '-'}`));
  const dir = document.getElementById('dir'); dir.replaceChildren();
  for (const d of w.directory) { const x = el('div', 's'); x.append(el('b', '', d.seat + ' '), el('span', 'c', d.contexts.map(c => c.slug).join(', ') || '(none)')); dir.append(x); }
}
(async () => {
  for (const m of await (await fetch('/read?since=2d&limit=300')).json()) add(m);
  new EventSource('/stream').onmessage = e => add(JSON.parse(e.data));
  who(); setInterval(who, 30000);
})();
document.getElementById('f').onsubmit = async e => {
  e.preventDefault();
  const to = document.getElementById('to').value.trim(), text = document.getElementById('text').value.trim();
  const r = await fetch('/send', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ from: 'operator/tom', to, text }) });
  const t = document.getElementById('text'); if (r.ok) t.value = ''; else { t.value = ''; t.placeholder = (await r.json()).error; }
};
</script></body></html>
